name: Publish tutorial website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Google Java Style with Spotless
        run: python3 tools/format_java.py check
      - name: Download database test driver
        run: |
          mkdir -p build/lib
          curl -fL --retry 3 --connect-timeout 10 --max-time 120 \
            -o build/lib/h2-2.2.224.jar \
            https://repo.maven.apache.org/maven2/com/h2database/h2/2.2.224/h2-2.2.224.jar
      - name: Verify code printed in the articles
        run: python3 tools/verify_article_code.py
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Render website
        run: quarto render
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
